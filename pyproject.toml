[project]
name = "audiolux"
version = "0.1.0"
description = "Music-reactive controller for LEDDMX-03 BLE LED strips"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "bleak>=3.0",
    "numpy>=2.0,<2.5",
    "sounddevice>=0.5",
    "yt-dlp>=2025.1",
    "librosa>=0.11",
    "soundfile>=0.13",
]

[project.scripts]
audiolux = "backend.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
